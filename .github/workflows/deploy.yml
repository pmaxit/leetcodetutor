name: Deploy to Railway

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Railway CLI
      run: npm install -g @railway/cli

    - name: Deploy to Railway
      run: railway up --project 1788c341-250a-4451-b45d-89cf435b602d --service app --environment production --detach -y --message "GitHub Actions Deploy"
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

